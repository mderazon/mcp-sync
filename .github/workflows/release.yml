name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Create Release Entry
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-release:
    name: Build (${{ matrix.target }})
    needs: [create-release]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            asset_name: mcp-sync-linux-x86_64.tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            asset_name: mcp-sync-linux-aarch64.tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            asset_name: mcp-sync-macos-x86_64.tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            asset_name: mcp-sync-macos-aarch64.tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            asset_name: mcp-sync-windows-x86_64.zip

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          tar -czvf "${{ matrix.asset_name }}" \
            -C "target/${{ matrix.target }}/release" mcp-sync \
            -C "${{ github.workspace }}" LICENSE README.md
          shasum -a 256 "${{ matrix.asset_name }}" > "${{ matrix.asset_name }}.sha256"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          7z a "${{ matrix.asset_name }}" \
            "./target/${{ matrix.target }}/release/mcp-sync.exe" \
            LICENSE README.md
          powershell -Command "Get-FileHash -Algorithm SHA256 '${{ matrix.asset_name }}' | ForEach-Object { \$_.Hash.ToLower() + '  ${{ matrix.asset_name }}' }" > "${{ matrix.asset_name }}.sha256"

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v3
        with:
          files: |
            ${{ matrix.asset_name }}
            ${{ matrix.asset_name }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
