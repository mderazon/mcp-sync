[package]
name = "mcp-sync"
version = "0.1.0"
edition = "2024"
description = "Fast, lightweight synchronization of MCP server definitions across Zed, VSCode, Antigravity, OpenCode, and Codex"
license = "MIT"
authors = ["Michael DeRazon <mderazon@users.noreply.github.com>"]
repository = "https://github.com/mderazon/mcp-sync"

[lib]
name = "mcp_sync"
path = "src/lib.rs"

[[bin]]
name = "mcp-sync"
path = "src/main.rs"

[dependencies]
dirs = "7"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml_edit = "0.25.13"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[dev-dependencies]
tempfile = "3"
